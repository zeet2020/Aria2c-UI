<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2235" />
      <stop offset="100%" stop-color="#0F111A" />
    </linearGradient>
    <!-- Neon Speed Chevron Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
  </defs>
  
  <!-- Outer Squircle Plate -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" stroke="#2A304D" stroke-width="4"/>
  
  <!-- The 'AUI' Abstract Frame (Outer 'A' / Shell) -->
  <path d="M166 380 L230 150 C234 135, 245 125, 256 125 C267 125, 278 135, 282 150 L346 380" 
        fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
        
  <!-- Core Download Speed Chevron (The Functional Focus) -->
  <path d="M190 230 L256 296 L322 230" fill="none" stroke="url(#glowGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 170 L256 285" fill="none" stroke="url(#glowGrad)" stroke-width="40" stroke-linecap="round"/>
</svg>
