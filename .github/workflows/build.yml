name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Allow the release job to create releases / upload assets.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 -> .deb, .AppImage, .rpm + raw binary
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            aria_src: extra/linux/x64/engine/aria2c
            aria_ext: ''
          # Windows x64 -> .msi, .exe (NSIS)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            aria_src: extra/win32/x64/engine/aria2c.exe
            aria_ext: '.exe'
          # macOS Apple Silicon -> .dmg, .app
          - platform: macos-latest
            target: aarch64-apple-darwin
            aria_src: extra/darwin/arm64/engine/aria2c
            aria_ext: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Skip the Electron-era postinstall (electron-builder + lint); legacy peer deps.
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Stage aria2 sidecar + config for this target
        shell: bash
        run: |
          mkdir -p src-tauri/binaries src-tauri/resources
          cp "${{ matrix.aria_src }}" "src-tauri/binaries/aria2c-${{ matrix.target }}${{ matrix.aria_ext }}"
          cp "$(dirname "${{ matrix.aria_src }}")/aria2.conf" src-tauri/resources/aria2.conf
          chmod +x "src-tauri/binaries/aria2c-${{ matrix.target }}${{ matrix.aria_ext }}" || true

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Create/append a GitHub release when run on a version tag.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Aria2 UI {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # Always expose the raw bundles as workflow artifacts (also for manual runs).
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria2-ui-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
            src-tauri/target/${{ matrix.target }}/release/aui
            src-tauri/target/${{ matrix.target }}/release/aui.exe
          if-no-files-found: ignore
